name: Cleanup merged Tuya feature branch (one-shot)
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/cleanup-tuya-lowpower-branch-once.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Remove only the already merged feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/feature/tuya-low-power-v0"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/feature/tuya-low-power-v0" >/dev/null 2>&1; then
            echo "ERROR: feature branch still exists" >&2
            exit 1
          fi
          echo "Merged feature branch successfully deleted."
