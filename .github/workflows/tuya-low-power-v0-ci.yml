name: Tuya MCU Low-Power v0 (host tests)

on:
  push:
    branches: [dev, feature/xr806-stage8-concurrency-lifecycle]
    paths:
      - "esphome/components/tuya/**"
      - "tests/tuya_low_power_v0_session_test.cpp"
      - "tests/tuya_low_power_standby_state_test.cpp"
      - "tests/tuya_low_power_sleep_window_test.cpp"
      - "tests/tuya_low_power_transaction_gate_test.cpp"
      - "tests/xr806/standby_service_lifecycle_test.cpp"
      - "esphome/components/xr806/**"
      - "esphome/components/api/**"
      - "esphome/components/ota/**"
      - "esphome/components/esphome/ota/**"
      - "esphome/components/mdns/**"
      - ".github/workflows/tuya-low-power-v0-ci.yml"
      - "tests/yaml/tuya_low_power_*.yaml"
  pull_request:
    branches: [dev]
    paths:
      - "esphome/components/tuya/**"
      - "tests/tuya_low_power_v0_session_test.cpp"
      - "tests/tuya_low_power_standby_state_test.cpp"
      - "tests/tuya_low_power_sleep_window_test.cpp"
      - "tests/tuya_low_power_transaction_gate_test.cpp"
      - "tests/xr806/standby_service_lifecycle_test.cpp"
      - "esphome/components/xr806/**"
      - "esphome/components/api/**"
      - "esphome/components/ota/**"
      - "esphome/components/esphome/ota/**"
      - "esphome/components/mdns/**"
      - ".github/workflows/tuya-low-power-v0-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-session:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and run Tuya low-power v0 state regression tests
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -I. \
            tests/tuya_low_power_v0_session_test.cpp \
            -o /tmp/tuya-low-power-v0-test
          /tmp/tuya-low-power-v0-test
          g++ -std=c++17 -Wall -Wextra -Werror -I. \
            tests/tuya_low_power_standby_state_test.cpp \
            -o /tmp/tuya-low-power-standby-state-test
          /tmp/tuya-low-power-standby-state-test
          g++ -std=c++17 -Wall -Wextra -Werror -I. \
            tests/tuya_low_power_sleep_window_test.cpp \
            -o /tmp/tuya-low-power-window-test
          /tmp/tuya-low-power-window-test
          g++ -std=c++17 -Wall -Wextra -Werror -I. \
            tests/tuya_low_power_transaction_gate_test.cpp \
            -o /tmp/tuya-transaction-gate-test
          /tmp/tuya-transaction-gate-test
          g++ -std=c++17 -Wall -Wextra -Werror -pthread -I. \
            tests/xr806/standby_service_lifecycle_test.cpp \
            -o /tmp/xr806-standby-lifecycle-test
          /tmp/xr806-standby-lifecycle-test
          echo "PASS transaction gating, CMD38 veto models, 10k concurrent PM votes and owner recovery"

  xr806-codegen:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Install ESPHome dependencies
        run: python -m pip install -e .
      - name: Validate native XR806 Tuya YAML
        run: python -m esphome config tests/yaml/tuya_low_power_v0_xr806.yaml
      - name: Generate XR806 C++ without a hardware SDK build
        run: |
          python -m esphome compile tests/yaml/tuya_low_power_v0_xr806.yaml --only-generate
          python -m esphome config tests/yaml/tuya_low_power_pb04_optin_codegen.yaml
          python -m esphome compile tests/yaml/tuya_low_power_pb04_optin_codegen.yaml --only-generate
      - name: Reject PB04 MCU wake without explicit verified wiring
        run: |
          if python -m esphome config tests/yaml/tuya_low_power_pb04_rejected.yaml > /tmp/pb04-invalid.log 2>&1; then
            echo "PB04 unexpectedly accepted without owner confirmation" >&2
            exit 1
          fi
          grep -q "Explicit physical pin-ownership" /tmp/pb04-invalid.log
      - name: Syntax-check Tuya C++ against generated ESPHome headers (SDK neutral)
        run: |
          set -euo pipefail
          DEFINES="$(find tests/yaml/.esphome -path "*/esphome/core/defines.h" -type f -print -quit)"
          test -n "$DEFINES" && test -s "$DEFINES"
          ROOT="${DEFINES%/esphome/core/defines.h}"
          {
            echo '#define USE_HOST'
            sed -e '/^#define USE_XR806/d' -e '/^#define USE_LVGL/d' "$ROOT/esphome/core/defines.h"
          } > /tmp/tuya-generated-defines.h
          cp /tmp/tuya-generated-defines.h esphome/core/defines.h
          git clone --quiet --filter=blob:none https://github.com/bblanchon/ArduinoJson.git /tmp/tuya-arduinojson
          git -C /tmp/tuya-arduinojson checkout --quiet 77771d3c07668e01d8f52acb03910c1110bb373f
          g++ -std=gnu++20 -fsyntax-only -Wall -Wextra             -I/tmp/tuya-arduinojson/src -I.             esphome/components/tuya/tuya.cpp             esphome/components/tuya/tuya_low_power_v0.cpp
