name: Tuya MCU Low-Power v0 (host tests)

on:
  push:
    branches: [dev, feature/xr806-ota-reversible-standby]
    paths:
      - "esphome/components/tuya/**"
      - "tests/tuya_low_power_v0_session_test.cpp"
      - "tests/tuya_low_power_standby_state_test.cpp"
      - "tests/tuya_low_power_sleep_window_test.cpp"
      - "tests/tuya_low_power_wire_transactions_test.cpp"
      - "tests/xr806/standby_interleaving_test.cpp"
      - "esphome/components/xr806/lowpower_policy.h"
      - "esphome/components/mdns/mdns_xr806.cpp"
      - ".github/workflows/tuya-low-power-v0-ci.yml"
      - "tests/yaml/tuya_low_power_*.yaml"
      - "tests/yaml/xr806_ota_readonly_diagnostic.yaml"
      - "tests/yaml/xr806_ota_readonly_wifi_v0.yaml"
      - "tests/yaml/xr806_ota_transport_noerase.yaml"
      - "esphome/components/ota/ota_backend_xr806.cpp"
      - "esphome/components/ota/ota_backend_xr806.h"
      - "esphome/components/ota/ota_backend_factory.h"
      - "esphome/components/esphome/ota/__init__.py"
  pull_request:
    # PR #12 is stacked on the upstream refactor branch until #13 lands.
    branches: [dev, claude/serene-franklin-jgpjuw]
    paths:
      - "esphome/components/tuya/**"
      - "tests/tuya_low_power_v0_session_test.cpp"
      - "tests/tuya_low_power_standby_state_test.cpp"
      - "tests/tuya_low_power_sleep_window_test.cpp"
      - ".github/workflows/tuya-low-power-v0-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-session:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and run Tuya low-power v0 state regression tests
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -I. \
            tests/tuya_low_power_v0_session_test.cpp \
            -o /tmp/tuya-low-power-v0-test
          /tmp/tuya-low-power-v0-test
          g++ -std=c++17 -Wall -Wextra -Werror -I. \
            tests/tuya_low_power_standby_state_test.cpp \
            -o /tmp/tuya-low-power-standby-state-test
          /tmp/tuya-low-power-standby-state-test
          g++ -std=c++17 -Wall -Wextra -Werror -I. \
            tests/tuya_low_power_sleep_window_test.cpp \
            -o /tmp/tuya-low-power-window-test
          /tmp/tuya-low-power-window-test
          g++ -std=c++17 -Wall -Wextra -Werror -I. \
            tests/tuya_low_power_wire_transactions_test.cpp \
            -o /tmp/tuya-low-power-wire-transactions-test
          /tmp/tuya-low-power-wire-transactions-test
          g++ -std=c++17 -pthread -Wall -Wextra -Werror -I. \
            tests/xr806/standby_interleaving_test.cpp \
            -o /tmp/xr806-standby-interleaving-test
          /tmp/xr806-standby-interleaving-test
          echo "PASS MCU wire serialization, cross-task PM fencing, CMD38 and standby interleavings"

  xr806-codegen:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Install ESPHome dependencies
        run: python -m pip install -e .
      - name: Validate native XR806 Tuya YAML
        run: python -m esphome config tests/yaml/tuya_low_power_v0_xr806.yaml
      - name: Generate XR806 C++ without a hardware SDK build
        run: |
          python -m esphome compile tests/yaml/tuya_low_power_v0_xr806.yaml --only-generate
          python -m esphome config tests/yaml/tuya_low_power_v0_xr806_network_suspend.yaml
          python -m esphome compile tests/yaml/tuya_low_power_v0_xr806_network_suspend.yaml --only-generate
          python -m esphome config tests/yaml/xr806_ota_readonly_diagnostic.yaml
          python -m esphome compile tests/yaml/xr806_ota_readonly_diagnostic.yaml --only-generate
          python -m esphome config tests/yaml/xr806_ota_transport_noerase.yaml
          python -m esphome compile tests/yaml/xr806_ota_transport_noerase.yaml --only-generate
          python -m esphome config tests/yaml/xr806_ota_readonly_wifi_v0.yaml
          python -m esphome compile tests/yaml/xr806_ota_readonly_wifi_v0.yaml --only-generate
          python - <<'PY'
          from pathlib import Path
          candidates = [p for p in Path("tests/yaml/.esphome").rglob("defines.h")
                        if "/xr806-ota-v0-ci/" in p.as_posix()]
          assert candidates, "read-only OTA+WiFi+Tuya fixture did not produce defines.h"
          flags = "\n".join(path.read_text() for path in candidates)
          for define in ("USE_XR806_OTA_RUNTIME_PROBE", "USE_WIFI", "USE_TUYA_LOW_POWER_V0"):
              assert f"#define {define}" in flags, (define, candidates)
          assert "#define USE_OTA\n" not in flags, "read-only diagnostics must not enable OTA uploads"
          print("PASS OTA read-only diagnostics with standard wifi: and Tuya V0")
          PY
          python -m esphome config tests/yaml/tuya_low_power_pb04_optin_codegen.yaml
          python -m esphome compile tests/yaml/tuya_low_power_pb04_optin_codegen.yaml --only-generate
      - name: Reject PB04 MCU wake without explicit verified wiring
        run: |
          if python -m esphome config tests/yaml/tuya_low_power_pb04_rejected.yaml > /tmp/pb04-invalid.log 2>&1; then
            echo "PB04 unexpectedly accepted without owner confirmation" >&2
            exit 1
          fi
          grep -q "Explicit physical pin-ownership" /tmp/pb04-invalid.log
      - name: Reject network_suspend without a standby coordinator
        run: |
          if python -m esphome config tests/yaml/tuya_low_power_v0_xr806_network_suspend_rejected.yaml > /tmp/wlan-invalid.log 2>&1; then
            echo "network_suspend unexpectedly accepted without standby" >&2
            exit 1
          fi
          grep -q "requires xr806.standby" /tmp/wlan-invalid.log
      - name: Admit XR806 OTA transport but reject flash writes in the platform backend
        run: |
          set -euo pipefail
          python -m esphome config tests/yaml/tuya_low_power_v0_xr806_ota_transport.yaml
          python -m esphome compile tests/yaml/tuya_low_power_v0_xr806_ota_transport.yaml --only-generate
          # Codegen acceptance is not a flash-write authorization. The backend
          # intentionally contains no vendor OTA push or flash erase/write calls.
          test -s esphome/components/ota/ota_backend_xr806.cpp
          ! grep -E 'ota_push_(start|data|finish)|flash_(erase|write)\(' esphome/components/ota/ota_backend_xr806.cpp
          grep -q 'OTA_RESPONSE_ERROR_NO_UPDATE_PARTITION' esphome/components/ota/ota_backend_xr806.cpp
          echo "PASS XR806 OTA transport-only YAML with no-write backend"
      - name: Reject tuya.refresh on a standard Tuya hub
        run: |
          if python -m esphome config tests/yaml/tuya_refresh_standard_rejected.yaml > /tmp/refresh-invalid.log 2>&1; then
            echo "tuya.refresh unexpectedly accepted on a standard Tuya hub" >&2
            exit 1
          fi
          grep -q "tuya.refresh requires protocol: low_power_v0" /tmp/refresh-invalid.log
      - name: Syntax-check Tuya C++ against generated ESPHome headers (SDK neutral)
        run: |
          set -euo pipefail
          DEFINES="$(find tests/yaml/.esphome -path "*/esphome/core/defines.h" -type f -print -quit)"
          test -n "$DEFINES" && test -s "$DEFINES"
          ROOT="${DEFINES%/esphome/core/defines.h}"
          {
            echo '#define USE_HOST'
            sed -e '/^#define USE_XR806/d' -e '/^#define USE_LVGL/d' "$ROOT/esphome/core/defines.h"
          } > /tmp/tuya-generated-defines.h
          cp /tmp/tuya-generated-defines.h esphome/core/defines.h
          git clone --quiet --filter=blob:none https://github.com/bblanchon/ArduinoJson.git /tmp/tuya-arduinojson
          git -C /tmp/tuya-arduinojson checkout --quiet 77771d3c07668e01d8f52acb03910c1110bb373f
          g++ -std=gnu++20 -fsyntax-only -Wall -Wextra             -I/tmp/tuya-arduinojson/src -I.             esphome/components/tuya/tuya.cpp             esphome/components/tuya/tuya_low_power_v0.cpp
          # Standard Tuya builds (no low_power_v0) must compile without the low-power code.
          sed -i '/^#define USE_TUYA_LOW_POWER_V0$/d' esphome/core/defines.h
          ! grep -q USE_TUYA_LOW_POWER_V0 esphome/core/defines.h
          g++ -std=gnu++20 -fsyntax-only -Wall -Wextra -I/tmp/tuya-arduinojson/src -I. \
            esphome/components/tuya/tuya.cpp esphome/components/tuya/tuya_low_power_v0.cpp
