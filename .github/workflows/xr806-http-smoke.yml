name: XR806 host unit tests
on:
  pull_request:
    paths:
      - 'esphome/components/web_server_xr806/**'
      - 'esphome/components/xr806/preference_journal.h'
      - 'tests/components/web_server_xr806/**'
      - 'tests/components/xr806/**'
      - '.github/workflows/xr806-http-smoke.yml'
  push:
    paths:
      - 'esphome/components/web_server_xr806/**'
      - 'esphome/components/xr806/preference_journal.h'
      - 'tests/components/web_server_xr806/**'
      - 'tests/components/xr806/**'
      - '.github/workflows/xr806-http-smoke.yml'
permissions:
  contents: read
jobs:
  gtest-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install GoogleTest
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtest-dev
      - name: Run the XR806 gtests with sanitizers
        run: |
          for test in tests/components/xr806/*_test.cpp tests/components/web_server_xr806/*_test.cpp; do
            g++ -std=gnu++20 -Wall -Wextra -Werror -O1 -fsanitize=address,undefined -fno-sanitize-recover=all -I. \
              "$test" -lgtest -lgtest_main -pthread -o /tmp/xr806-gtest
            /tmp/xr806-gtest
          done
