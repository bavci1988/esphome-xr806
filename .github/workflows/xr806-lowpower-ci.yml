name: XR806 Low-Power Policy (MCU-independent)

on:
  push:
    branches: [dev, feature/xr806-ota-reversible-standby]
  pull_request:
    branches: [dev]
    paths:
      - "esphome/components/xr806/lowpower_policy.h"
      - "esphome/components/xr806/ota_update_pm_gate.h"
      - "esphome/components/xr806/ota_flash_plan.h"
      - "esphome/components/ota/ota_backend.cpp"
      - "tests/xr806/ota_update_preflight_test.cpp"
      - "tools/xr806/inspect_ota_geometry.py"
      - "tests/xr806/ota_geometry_test.py"
      - "esphome/components/xr806/wifi_power_save_retry.h"
      - "esphome/components/xr806/standby_trial_state.h"
      - "esphome/components/xr806/standby_trial.cpp"
      - "esphome/components/xr806/standby_trial.h"
      - "esphome/components/xr806/__init__.py"
      - "tests/xr806/standby_trial_state_test.cpp"
      - "tests/xr806/standby_coordinator_state_test.cpp"
      - "esphome/components/xr806/standby_coordinator_state.h"
      - "esphome/components/xr806/standby_network_lifecycle.h"
      - "tests/xr806/standby_race_network_lifecycle_test.cpp"
      - "esphome/components/xr806/standby_controller.h"
      - "esphome/components/xr806/standby_controller.cpp"
      - "tests/xr806/lowpower_stage7a_test.cpp"
      - ".github/workflows/xr806-lowpower-ci.yml"

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build MCU-neutral policy and WiFi PS retry tests
        run: |
          set -euo pipefail
          g++ -std=gnu++20 -Wall -Wextra -Werror -pthread -I. \
            tests/xr806/lowpower_stage7a_test.cpp \
            -o /tmp/xr806-lowpower-policy-test
          /tmp/xr806-lowpower-policy-test
          g++ -std=gnu++20 -Wall -Wextra -Werror -pthread -I. \
            tests/xr806/standby_trial_state_test.cpp \
            -o /tmp/xr806-stage7b-trial-test
          /tmp/xr806-stage7b-trial-test
          g++ -std=gnu++20 -Wall -Wextra -Werror -pthread -I. \
            tests/xr806/standby_coordinator_state_test.cpp \
            -o /tmp/xr806-stage7b-production-state-test
          /tmp/xr806-stage7b-production-state-test
          g++ -std=gnu++20 -Wall -Wextra -Werror -pthread -I. \
            tests/xr806/standby_race_network_lifecycle_test.cpp \
            -o /tmp/xr806-standby-network-race-test
          /tmp/xr806-standby-network-race-test
          g++ -std=gnu++20 -Wall -Wextra -Werror -I. \
            tests/xr806/ota_update_preflight_test.cpp \
            -o /tmp/xr806-ota-update-preflight-test
          /tmp/xr806-ota-update-preflight-test
          python3 tests/xr806/ota_geometry_test.py
          echo "PASS fail-closed OTA PM gate and no-write flash-layout preflight"
          echo "PASS low-power admission fence and 120 WLAN/API/OTA/mDNS/UART interleavings"
