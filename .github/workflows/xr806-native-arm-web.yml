name: XR806 native ARM web firmware

on:
  pull_request:
    paths:
      - "esphome/components/xr806/**"
      - "esphome/components/web_server_xr806/**"
      - "esphome/components/web_server/**"
      - "esphome/components/web_server_base/**"
      - "esphome/components/ota/**"
      - "esphome/components/wifi/**"
      - "tests/component_tests/xr806/**"
      - ".github/workflows/xr806-native-arm-web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-config:
    name: Native web+OTA+standby YAML codegen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.15"
          enable-cache: false
      - name: Install ESPHome
        run: uv pip install --system -e .
      - name: Validate and generate standard web configurations
        run: |
          esphome config tests/component_tests/xr806/config/web_server_ota_enabled.yaml
          esphome config tests/component_tests/xr806/config/web_server_standby.yaml
          esphome config tests/component_tests/xr806/config/web_server_ota_standby.yaml
          esphome compile --only-generate tests/component_tests/xr806/config/web_server_ota_standby.yaml

  sdk-access:
    name: Check isolated XR806 SDK access
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.detect.outputs.enabled }}
    steps:
      - id: detect
        shell: bash
        env:
          SDK_TOKEN: ${{ secrets.XR806_SDK_READ_TOKEN }}
        run: |
          if [ -z "$SDK_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "### XR806 ARM cross-build skipped (SDK read token missing)" >> "$GITHUB_STEP_SUMMARY"
            echo "Set the read-only XR806_SDK_READ_TOKEN secret to enable native linkage." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  arm-web:
    name: Native WXU firmware with web OTA and guarded standby
    needs: [sdk-access, web-config]
    if: needs.sdk-access.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          repository: bavci1988/xr806-sdk
          ref: 2c0217b7f4d25d25e4645a47ef353142b63f5e36
          path: xr806-sdk
          token: ${{ secrets.XR806_SDK_READ_TOKEN }}
          persist-credentials: false
      - name: Install XR806 ARM toolchain
        timeout-minutes: 12
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi make
          arm-none-eabi-g++ --version
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.15"
          enable-cache: false
      - name: Install ESPHome
        run: uv pip install --system -e .
      - name: Verify pinned SDK and compile real AWIH image
        timeout-minutes: 25
        env:
          XR806_SDK_SOURCE_DIR: ${{ github.workspace }}/xr806-sdk
          XR806_SDK_EXPECTED_COMMIT: 2c0217b7f4d25d25e4645a47ef353142b63f5e36
        run: |
          test "$(git -C xr806-sdk rev-parse HEAD)" = "$XR806_SDK_EXPECTED_COMMIT"
          esphome compile tests/component_tests/xr806/config/web_server_ota_standby.yaml
      - name: Preserve firmware and link map
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: xr806-web-arm-output
          if-no-files-found: ignore
          retention-days: 7
          path: |
            tests/component_tests/xr806/config/.esphome/build/**/firmware.bin
            tests/component_tests/xr806/config/.esphome/build/**/xr806/app.elf
            tests/component_tests/xr806/config/.esphome/build/**/xr806/firmware/firmware.img
