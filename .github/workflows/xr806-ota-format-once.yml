name: XR806 OTA one-time upstream formatter
on:
  push:
    branches: [feature/xr806-ota-reversible-standby]
    paths:
      - ".github/workflows/xr806-ota-format-once.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'bavci1988/esphome-xr806' && github.ref == 'refs/heads/feature/xr806-ota-reversible-standby'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Apply pinned upstream lint naming and formatting
        run: |
          set -euo pipefail
          python -m pip install clang-format==23.1.3 ruff==0.17.3
          python - <<'PY'
          from pathlib import Path
          for name, old, new in [
              ("esphome/components/xr806/ota_flash_plan.h", "ERASE_SECTOR", "erase_sector"),
              ("esphome/components/xr806/ota_vendor_runtime_preflight.h", "SECTOR", "sector"),
          ]:
              path = Path(name)
              original = path.read_text()
              if old not in original:
                  raise SystemExit("Missing expected local identifier: " + name)
              path.write_text(original.replace(old, new))
          test_path = Path("tests/xr806/ota_geometry_test.py")
          source = test_path.read_text()
          import re
          source, count = re.subn(
              r'^    assert False, "([^"]+)"$',
              lambda match: '    raise AssertionError("' + match.group(1) + '")',
              source,
              flags=re.MULTILINE,
          )
          if count != 5:
              raise SystemExit("Expected five unsafe fixture asserts, found " + str(count))
          test_path.write_text(source.removeprefix("#!/usr/bin/env python3\n"))
          tool_path = Path("tools/xr806/inspect_ota_geometry.py")
          tool_path.write_text(tool_path.read_text().removeprefix("#!/usr/bin/env python3\n"))
          PY
          clang-format -i -style=file \
            esphome/components/xr806/ota_dry_run_session.h \
            esphome/components/xr806/ota_flash_plan.h \
            esphome/components/xr806/ota_update_pm_gate.h \
            esphome/components/xr806/ota_vendor_runtime_preflight.h \
            esphome/components/xr806/ota_vendor_sdk_snapshot.h \
            esphome/components/xr806/runtime.cpp \
            tests/xr806/ota_update_preflight_test.cpp \
            tests/xr806/ota_vendor_runtime_test.cpp
          ruff format tests/xr806/ota_geometry_test.py tools/xr806/inspect_ota_geometry.py
          ruff check --fix tests/xr806/ota_geometry_test.py tools/xr806/inspect_ota_geometry.py
      - name: Commit formatted OTA-only files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add esphome/components/xr806/ota_*.h esphome/components/xr806/runtime.cpp \
            tests/xr806/ota_* tools/xr806/inspect_ota_geometry.py
          if ! git diff --cached --quiet; then
            git commit -m "style(xr806-ota): apply upstream clang-format, ruff and clang-tidy naming"
            git push origin HEAD:refs/heads/feature/xr806-ota-reversible-standby
          fi
