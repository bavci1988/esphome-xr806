name: XR806 OTA writer unit tests
on:
  push:
    branches: [feature/xr806-ota-writer-part-vi]
    paths:
      - "esphome/components/ota/ota_backend_xr806.*"
      - "esphome/components/xr806/ota_writer_*"
      - "tools/xr806/*.py"
      - "tests/xr806/*ota*"
      - ".github/workflows/xr806-ota-writer-tests.yml"
  pull_request:
    paths:
      - "esphome/components/ota/ota_backend_xr806.*"
      - "esphome/components/xr806/ota_writer_*"
      - "tools/xr806/*.py"
      - "tests/xr806/*ota*"
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test packager and corrupted or oversized images
        run: |
          python3 -m unittest discover -s tests/xr806 -p test_make_ota_xz.py -v
          python3 -m unittest discover -s tests/xr806 -p test_ota_factory_migration.py -v
      - name: Compile and execute flash-admission C++20 tests
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -I. tests/xr806/ota_writer_part_vi_test.cpp -o /tmp/xr806-ota-test
          /tmp/xr806-ota-test
