esphome:
  name: xr806-trv16-low-power
xr806:
  board: wxu
  lowpower: true
  standby:
    enabled: true
    wake_after: 3000ms
    quiet_time: 250ms
    min_awake_time: 5000ms
    wake_pin: PA20
    wake_edge: falling
    require_external_sync: true

uart:
  id: trv16_uart
  tx_pin: PB0
  rx_pin: PB1
  baud_rate: 115200
  rx_buffer_size: 256
  data_bits: 8
  stop_bits: 1
  parity: NONE

tuya:
  id: trv16_mcu
  uart_id: trv16_uart
  protocol: low_power_v0
  auto_baud: true
  # CI/codegen ONLY. Never use on the sole live TRV16 without scope proof.
  trv16_mcu_wake_pb04: active_high
  trv16_pb04_confirmed: true

climate:
  - platform: tuya
    name: TRV16 Climate
    tuya_id: trv16_mcu
    switch_datapoint: 1
    target_temperature_datapoint: 3
    current_temperature_datapoint: 4
    target_temperature_multiplier: 0.1
    current_temperature_multiplier: 0.1
