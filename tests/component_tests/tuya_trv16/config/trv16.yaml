esphome:
  name: xr806-trv16-low-power
xr806:
  board: wxu
  lowpower: true
  standby:
    enabled: true
    wake_after: 3000ms
    quiet_time: 250ms
    min_awake_time: 5000ms
    wake_pin: PA20
    wake_edge: falling
    require_external_sync: true

uart:
  id: trv16_uart
  tx_pin: PB0
  rx_pin: PB1
  baud_rate: 115200
  rx_buffer_size: 256
  data_bits: 8
  stop_bits: 1
  parity: NONE

tuya:
  id: trv16_mcu
  uart_id: trv16_uart
  protocol: low_power
  auto_baud: true
  product_id: ihedujbuli6hsx9b

climate:
  - platform: tuya
    name: TRV16 Climate
    tuya_id: trv16_mcu
    switch_datapoint: 1
    target_temperature_datapoint: 3
    current_temperature_datapoint: 4
    target_temperature_multiplier: 0.1
    current_temperature_multiplier: 0.1

button:
  - platform: template
    name: TRV16 Refresh
    on_press:
      - tuya.refresh:
          tuya_id: trv16_mcu
  - platform: tuya_trv16
    save_day:
      name: Save program day
    save_all_days:
      name: Save program all days

tuya_trv16:
  tuya_id: trv16_mcu

select:
  - platform: tuya_trv16
    program_day:
      name: Program day

datetime:
  - platform: tuya_trv16
    point_1_time:
      name: Point 1 time
    point_6_time:
      name: Point 6 time

number:
  - platform: tuya_trv16
    point_1_temperature:
      name: Point 1 temperature

text_sensor:
  - platform: tuya_trv16
    sunday:
      name: Program Sunday
