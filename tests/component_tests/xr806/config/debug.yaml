esphome:
  name: xr806-debug-ci

xr806:
  board: wxu

logger:
  level: DEBUG

debug:
  update_interval: 5s

sensor:
  - platform: debug
    free:
      name: Heap Free
    loop_time:
      name: Loop Time
    cpu_frequency:
      name: CPU Frequency

text_sensor:
  - platform: debug
    device:
      name: Device Info
    reset_reason:
      name: Reset Reason
