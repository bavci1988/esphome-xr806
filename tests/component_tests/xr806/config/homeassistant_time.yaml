esphome:
  name: xr806-ha-time-ci
xr806:
  board: wxu
wifi:
  ssid: XR806-CI-NO-REAL-NETWORK
  password: test-only-not-secret
logger:
  level: DEBUG
api:
time:
  - platform: homeassistant
    id: ha_time
    timezone: Europe/Berlin
    on_time_sync:
      then:
        - logger.log: "Time from Home Assistant"
    on_time:
      - seconds: 0
        minutes: /5
        then:
          - logger.log: "Every five minutes"
