esphome:
  name: xr806-http-standby-ci
xr806:
  board: wxu
  wlan:
    network_suspend: true
  standby:
    enabled: true
    wake_pin: PA20
    wake_edge: falling
wifi:
  ssid: XR806-CI-NO-REAL-NETWORK
  password: test-only-not-secret
logger:
  level: DEBUG
http_request:
  verify_ssl: false
  timeout: 10s
ota:
  - platform: http_request
update:
  - platform: http_request
    name: Firmware update
    source: https://example.com/xr806/manifest.json
interval:
  - interval: 1h
    then:
      - http_request.get:
          url: http://example.com/status
          collect_headers:
            - content-type
          capture_response: true
          on_response:
            then:
              - logger.log:
                  format: "Status %d, %s"
                  args: [response->status_code, body.c_str()]
      - http_request.post:
          url: https://example.com/post
          json:
            value: "42"
      - http_request.send:
          method: PUT
          url: http://user:p%40ss@example.com/put
          body: "on"
      - http_request.send:
          method: DELETE
          url: http://example.com/item/1
      - ota.http_request.flash:
          url: http://example.com/firmware.img
          md5_url: http://example.com/firmware.md5
          username: admin
          password: secret
