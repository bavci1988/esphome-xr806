esphome:
  name: xr806-prometheus-ci
xr806:
  board: wxu
wifi:
  ssid: XR806-CI-NO-REAL-NETWORK
  password: test-only-not-secret
web_server:
  port: 80
  version: 2
  log: false
prometheus:
  include_internal: true
  relabel:
    xr806_temperature:
      id: xr806_board_temperature
      name: Board Temperature
sensor:
  - platform: template
    id: xr806_temperature
    name: Temperature
    lambda: return 21.5f;
    update_interval: 10s
