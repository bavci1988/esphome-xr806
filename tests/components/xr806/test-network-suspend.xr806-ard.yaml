# Standby that parks the WLAN link, with the web server, MQTT and no UART
xr806:
  standby:
    enabled: true
    wake_after: 1min
  wlan:
    listen_interval: 3
    network_suspend: true

wifi:
  ssid: MySSID
  password: password1

web_server:

mqtt:
  broker: 192.168.1.2
  # No MQTT connection lasts through a standby with network_suspend
  reboot_timeout: 0s

ota:
  - platform: web_server
