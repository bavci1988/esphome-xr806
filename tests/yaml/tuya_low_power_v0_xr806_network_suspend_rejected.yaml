# CI-only: intentionally fake SSID and wake edge; NOT live-device wiring proof.
esphome:
  name: xr806-network-suspend-ci
xr806:
  board: wxu
  lowpower: true
  wifi:
    ssid: TEST-NETWORK-NO-HARDWARE
    password: TestOnlyPassword123
    network_bridge: true
    power_save: true
    network_suspend: true
network:
api:
mdns:
uart:
  id: uart_mcu
  tx_pin: PB0
  rx_pin: PB1
  baud_rate: 115200
tuya:
  id: mcu
  uart_id: uart_mcu
  protocol: low_power_v0
  auto_baud: true
